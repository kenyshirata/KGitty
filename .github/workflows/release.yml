name: Release

# Pushing a tag such as v0.2.0 builds the Windows installer and publishes it as a GitHub release.
# The app checks that release (latest.yml) to offer automatic updates.
# A tag with a suffix (v0.3.0-rc.1) is published as a pre-release, which the updater ignores.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Only build here. electron-builder's own publisher uploads the installer and its metadata in parallel and the
      # parallel uploads race to create the release, which once left it without the installer and latest.yml.
      - name: Build the installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # gh reports "not found" on stderr; do not let that stop the script (Actions runs pwsh with errors fatal).
          $ErrorActionPreference = 'Continue'
          # The tag arrives as an environment variable; in PowerShell that is $env:TAG, a plain $TAG would be empty.
          $TAG = $env:TAG
          if (-not $TAG) { throw 'No tag name to publish' }
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '^KGitty-Setup-.*\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw "Expected the installer, its blockmap and latest.yml, found: $($files -join ', ')" }
          Write-Host "Files: $($files -join ', ')"
          $pre = @(); if ($TAG -match '-') { $pre = @('--prerelease') }
          # Decide by what gh prints (the tag name) rather than by its exit code.
          $found = "$(gh release view $TAG --json tagName --jq .tagName 2>$null)".Trim()
          Write-Host "Existing release: '$found'"
          if ($found -eq $TAG) {
            # The release exists already (re-run): replace its files.
            Write-Host 'Release exists, uploading the files'
            gh release upload $TAG @files --clobber
          } else {
            Write-Host 'Creating the release'
            gh release create $TAG @files --title $TAG --generate-notes @pre
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed (exit $LASTEXITCODE)" }
          # The release must carry all three files before the job counts as done.
          $names = @(gh release view $TAG --json assets --jq '.assets[].name')
          Write-Host "Assets: $($names -join ', ')"
          foreach ($f in $files) { if ($names -notcontains [IO.Path]::GetFileName($f)) { throw "Missing from the release: $f" } }
